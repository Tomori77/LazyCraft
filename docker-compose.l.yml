# ========================================
# LazyCraft 主部署编排（方案 1：薄层接入）
# ========================================
# 适用环境：服务器已通过 1Panel 运行 PostgreSQL 容器 1Panel-postgresql-Vwx8
# 本文件只定义 nginx + backend 两个服务：
#   - 不重复启动 PostgreSQL，直接复用 1Panel 现有容器，避免双实例争抢 4G 内存
#   - 通过 external 网络加入 1Panel 既有网络，跨容器用容器名互通
# 无 1Panel 环境时，改用 docker-compose.full.yml（自包含整套栈）

name: lazycraft

networks:
  # 1Panel 为容器创建的默认 bridge 网络名
  # 若服务器上实际名称不同：docker network ls 查名 → 用 1PANEL_NETWORK=xxx 覆盖
  onepanel:
    name: ${PANEL_NETWORK:-1panel-network}
    external: true

services:
  backend:
    image: ghcr.io/tomori77/lazycraft-api:latest
    container_name: lazycraft-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL 由部署环境注入（服务器 shell 导出或根目录 .env），
      # 格式：postgresql://LazyCraft:<密码>@1Panel-postgresql-Vwx8:5432/LazyCraft
      DATABASE_URL: ${DATABASE_URL:?请先在外部环境（shell 或 .env）提供 DATABASE_URL}
      # 迁移命令只读 MIGRATE_DATABASE_URL，不回退到 DATABASE_URL：
      # 迁移目标是业务库 LazyCraft，而非开发期临时用的 lazycraft_auth
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?请先提供 MIGRATE_DATABASE_URL（业务库连接串）}
      JWT_SECRET: ${JWT_SECRET:?请先提供 JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    networks:
      - onepanel
    # 不映射宿主机端口：所有流量只允许经 nginx 反代进入，缩小暴露面
    expose:
      - "3000"
    mem_limit: 1g
    healthcheck:
      # Node 22 自带 fetch，无需额外安装 curl/wget
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on: []

  nginx:
    image: nginx:1.27-alpine
    container_name: lazycraft-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 只读挂载防止容器内误写静态资源；前端产物在宿主机 pnpm build 生成
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - onepanel
    mem_limit: 50m
    depends_on:
      - backend

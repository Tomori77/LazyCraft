# LazyCraft Nginx 站点配置
# 职责：静态托管前端构建产物 + 反代 API / WebSocket 到 backend:3000
# 设计说明：
#   - 后端容器不直接暴露宿主机端口，所有外部流量统一从 Nginx 入口
#   - try_files $uri $uri/ /index.html：SPA 前端路由必须兜底到 index.html，
#     否则刷新非根路径会返回 404

# gzip 压缩：静态资源文本体积大，开启后显著减少 4C4G 小服务器的带宽占用
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全响应头：防止点击劫持 / MIME 嗅探 / XSS 反射，成本极低收益明确
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 指纹的构建产物（Vite 输出 assets/*.js|css 必含内容 hash），
    # 内容不变则文件名不变，可安全长缓存一年；index.html 不缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 单页应用：所有前端路由统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 是路由入口，缓存会导致发版后用户拿到旧页面
        add_header Cache-Control "no-cache";
    }

    # 探活反代：与容器 healthcheck 打同一路径，使 LB/Nginx 层也能探活。
    # 用 = 精确匹配，避免被 location / 的 SPA 兜底吞掉而返回 index.html
    location = /health {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # API 反代到 backend 容器（同 compose 网络内用服务名解析）
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 反代（任务预留：全服广播等推送能力走 /ws 前缀）
    # Upgrade/Connection 头缺失时连接会以普通 HTTP 处理，握手必然失败
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 挂机游戏 WebSocket 长连接，空闲超时拉长避免频繁断线重连
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
